name: S01 diagnose palette after delayed language rebuild

on:
  push:
    branches:
      - diagnostics/s01-palette-rebuild-race-20261104
    paths:
      - .github/workflows/s01-palette-race.yml
      - .github/scripts/s01_ci_watchdog.py
      - test_regression.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palette-regression:
    name: Palette creation after processing queued rebuilds
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements
        shell: cmd
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run regression tests with real process exit
        shell: cmd
        run: python -u -m unittest -v test_regression

  full-suite:
    name: Full suite exit after timing diagnostic
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements
        shell: cmd
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run all tests and record actual exit / timeout
        shell: cmd
        run: python .github/scripts/s01_ci_watchdog.py full
      - name: Upload full suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-palette-full-suite-evidence
          path: |
            f01-full-ci.log
            f01-full-ci.meta.txt
          if-no-files-found: warn
