name: F03 legacy migration safety

on:
  push:
    branches:
      - feat/f03-safe-legacy-migration
  pull_request:
    branches:
      - fix/f02-executable-name
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-dpapi-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Compile snapshot and test modules
        run: python -m compileall -q legacy_migration.py legacy_stage.py legacy_upgrade_cli.py legacy_handover_preview.py test_legacy_migration.py test_legacy_stage.py test_legacy_cli.py test_legacy_handover_preview.py legacy_data_compatibility.py test_legacy_data_compatibility.py test_legacy_handover_restart.py legacy_shortcut_preview.py test_legacy_shortcut_preview.py legacy_resources_preview.py test_legacy_resources_preview.py test_legacy_resources_restart.py legacy_shortcut_inspection.py test_legacy_shortcut_inspection.py legacy_shortcut_escrow.py test_legacy_shortcut_escrow.py
      - name: Require all read-only/DPAPI snapshot tests to pass
        run: python -m unittest -v test_legacy_migration test_legacy_stage test_legacy_cli test_legacy_handover_preview test_legacy_data_compatibility test_legacy_shortcut_preview test_legacy_resources_preview
      - name: Exercise real DPAPI and disposable HKCU migration-preparation pipeline
        run: python -m unittest -v test_legacy_windows_pipeline
      - name: Prove fresh-process recovery after sudden Python termination
        run: python -m unittest -v test_legacy_handover_restart
      - name: Prove registry and shortcut recovery after real subprocess crash
        run: python -m unittest -v test_legacy_resources_restart
      - name: Inspect real legacy Windows Shell Link targets without modifying shortcuts
        run: python -m unittest -v test_legacy_shortcut_inspection
      - name: Encrypt original real shortcuts and prove isolated recovery
        run: python -m unittest -v test_legacy_shortcut_escrow
      - name: Retain previous fail-closed legacy refusal coverage
        run: python -m unittest -v test_legacy_upgrade_guard
      - name: Require installer filename contract unchanged
        run: python -m unittest -v test_installer_safety.TestF02ExecutableName

  legacy-inventory-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read-only inventory and injected-cipher fail-closed tests
        run: python -m unittest -v test_legacy_migration test_legacy_stage test_legacy_cli test_legacy_handover_preview test_legacy_data_compatibility test_legacy_shortcut_preview test_legacy_resources_preview test_legacy_shortcut_inspection test_legacy_shortcut_escrow
