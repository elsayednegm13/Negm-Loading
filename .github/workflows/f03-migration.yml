name: F03 legacy migration safety

on:
  push:
    branches:
      - feat/f03-safe-legacy-migration
  pull_request:
    branches:
      - fix/f02-executable-name
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-dpapi-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Compile snapshot and test modules
        run: python -m compileall -q legacy_migration.py legacy_stage.py legacy_upgrade_cli.py test_legacy_migration.py test_legacy_stage.py test_legacy_cli.py
      - name: Require all read-only/DPAPI snapshot tests to pass
        run: python -m unittest -v test_legacy_migration test_legacy_stage test_legacy_cli
      - name: Retain previous fail-closed legacy refusal coverage
        run: python -m unittest -v test_legacy_upgrade_guard
      - name: Require installer filename contract unchanged
        run: python -m unittest -v test_installer_safety.TestF02ExecutableName

  legacy-inventory-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read-only inventory and injected-cipher fail-closed tests
        run: python -m unittest -v test_legacy_migration
